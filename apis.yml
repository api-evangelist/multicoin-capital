aid: multicoin-capital
name: Multicoin Capital
description: >-
  Multicoin Capital is a thesis-driven crypto investment firm founded in 2017 by
  Kyle Samani and Tushar Jain, investing in cryptocurrencies, tokens, and
  blockchain companies and protocols believed to be reshaping trillion-dollar
  markets. The firm runs a hybrid structure of a hedge fund (its multi-billion
  dollar Master Fund, investing in public markets, direct positions, and
  strategic sales) alongside several venture funds that back early-stage
  companies, with venture checks ranging from roughly $1M to $50M. Its Venture
  Fund III closed at $422 million in January 2022. Multicoin invests across open
  and decentralized finance (DeFi), blockchain infrastructure and Layer 1/Layer 2
  protocols, decentralized physical infrastructure networks (DePIN), stablecoins
  and payments, real-world asset tokenization, wallets, identity, gaming, and
  crypto-native consumer applications, with a well-known concentration around the
  Solana ecosystem. The firm's phoenix logo symbolizes a new financial system
  rising from the ashes of the old one, reflecting its long-term, high-conviction
  approach to absolute returns across market cycles. Headquartered in Austin,
  Texas, Multicoin manages capital on behalf of family offices, foundations,
  endowments, and institutional investors. In February 2026 co-founder Kyle
  Samani stepped back from day-to-day management, with operations continuing under
  co-founder Tushar Jain and partner Brian Smith.
